<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6ecdc">
<title>Wobble Works Classic · 搭把手</title>
<link rel="stylesheet" href="style2d.css">
</head>
<body>

<!-- ===================== BOARD / TV ===================== -->
<div id="board" class="view hidden">
  <canvas id="b-canvas"></canvas>

  <header id="b-head">
    <div class="brand">WOBBLE WORKS<span>CLASSIC 2D</span></div>
    <div class="tabs" id="b-tabs"></div>
    <div class="spacer"></div>
    <div class="pill" id="b-players">👥 0 wobblers</div>
    <a class="pill" href="../?board=1">🎲 3D ARENA</a>
  </header>

  <aside id="b-brief">
    <h2 id="b-title">THE DOOR</h2>
    <div class="cn" id="b-cn">第一课 · 门</div>
    <p id="b-text"></p>
    <div id="b-tier" class="cn"></div>
    <div class="row" id="b-tools">
      <button class="btn ghost" data-tool="crate">📦 Crate</button>
      <button class="btn ghost" data-tool="plank">🪵 Plank</button>
      <button class="btn ghost" data-tool="barrel">🛢 Barrel</button>
      <span class="pill" id="b-budget">4 left</span>
    </div>
    <div class="row">
      <button class="btn" id="b-hint">💡 Hint</button>
      <button class="btn" id="b-next">➡ Next</button>
      <button class="btn ghost" id="b-reset">↺ Reset</button>
    </div>
    <div id="b-goal">Get the Glow Core into the ⭐ beacon.</div>
  </aside>

  <div id="b-join">
    <div id="qr"></div>
    <div id="join-url">loading…</div>
  </div>

  <div id="b-toast" class="toast"></div>

  <div id="win-banner" class="win hidden">
    <div class="win-card">
      <h1 id="win-title">CHAPTER CLEAR!</h1>
      <div class="medal" id="win-medal">CHAOS GREMLINS</div>
      <p id="win-sub" style="color:var(--ink-soft);font-size:13px;margin:10px 0 0"></p>
    </div>
  </div>
</div>

<!-- ===================== PHONE / PC CONTROLLER ===================== -->
<div id="phone" class="view hidden">
  <div id="p-top">
    <canvas id="p-canvas"></canvas>
    <div id="p-hud">
      <div class="pill" id="p-name">…</div>
      <div class="pill" id="p-score">⭐ 0</div>
      <div class="spacer"></div>
      <a class="pill" href="./?board=1">🖥</a>
    </div>
    <div id="p-toast" class="toast"></div>
  </div>

  <div id="p-deck">
    <div class="pad">
      <div class="key" id="k-left">◀</div>
      <div class="key" id="k-right">▶</div>
    </div>
    <div id="p-mid">
      <div class="key grab" id="k-grabL">✋L</div>
      <div class="key grab small" id="k-grabR">✋R</div>
    </div>
    <div class="pad" style="align-items:center">
      <div class="key" id="k-jump">JUMP</div>
    </div>
    <div class="pad" style="flex-direction:column">
      <div class="key small" id="k-call1">👋</div>
      <div class="key small" id="k-call2">😱</div>
    </div>
  </div>

  <div id="join-card">
    <div class="inner">
      <h1>Join Wobble Works <span style="color:var(--accent)">Classic</span></h1>
      <p>The side-view one. Grab the Core with both hands and wobble it home.</p>
      <input id="name-input" maxlength="14" placeholder="Your name" autocomplete="off">
      <button class="btn primary" id="join-go">PLAY ▶</button>
    </div>
  </div>
</div>

<script src="../vendor/qrcode.js"></script>
<script src="/config.js"></script>
<script src="app2d.js"></script>
</body>
</html>
