<sc-if value="{{hud}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 12px; top: 12px; width: 92px; height: 114px; box-sizing: border-box; background: #f8f1e2; border: 3px solid #171513; clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 7px), calc(100% - 7px) 100%, 7px 100%, 0 calc(100% - 7px), 0 7px); display: flex; flex-direction: column; align-items: center; padding-top: 7px">
<div class="lat" style="font-size: 9.5px; font-weight: 700; letter-spacing: .14em; line-height: 12px; color: #cc3524">目标 GOAL</div>
<div class="zi" style="font-size: 52px; line-height: 56px; color: #171513">明</div>
<div class="lat" style="font-size: 14px; font-weight: 600; line-height: 16px">míng</div>
<div class="lat" style="font-size: 12px; line-height: 14px; color: #5a544b">bright</div>
</div>

<div style="position: absolute; right: 58px; top: 12px; height: 50px; box-sizing: border-box; padding: 0 14px 0 10px; background: #f8f1e2; border: 3px solid #171513; clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px); display: flex; align-items: center; gap: 8px">

<svg width="20" height="18" viewBox="0 0 20 18" aria-hidden="true"><path d="M4,3 H16 M5,9 H15 M2,15 H18" stroke="#f8f1e2" stroke-width="2.6" fill="none"></path></svg>

<div class="lat" style="position: absolute; left: 50%; top: 138px; transform: translateX(-50%); height: 30px; box-sizing: border-box; padding: 0 22px; display: flex; align-items: center; gap: 5px; background: #f8f1e2; border-top: 2px solid #171513; border-bottom: 2px solid #171513; font-size: 13px; line-height: 16px; white-space: nowrap; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 50%, 100% 100%, 0 100%, 10px 50%)">
<span>Set</span><span class="zi" style="font-size: 18px; color: #1b5aa6">月</span><span>yuè</span><span style="font-weight: 700">beside</span><span class="zi" style="font-size: 18px; color: #b06f06">日</span><span>rì</span><span>→</span><span class="zi" style="font-size: 18px; color: #cc3524">明</span><span>míng</span>

</div>

<span class="zi" style="font-size: 22px; line-height: 24px">旁</span>
<span class="lat" style="font-size: 10px; font-weight: 600; line-height: 11px">páng</span>
<span class="lat" style="font-size: 7.5px; font-weight: 800; letter-spacing: .08em; line-height: 9px">BESIDE</span>
</button>

<button aria-label="Jump" style="position: absolute; right: 16px; bottom: 28px; width: 66px; height: 66px; padding: 0; margin: 0; border-radius: 50%; background: #cc3524; border: 3px solid #171513; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f8f1e2; cursor: pointer">

</button>

<script type="text/x-dc" data-dc-script data-props='{"hud":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>

    return { hud: this.props.hud ?? true };
  }
}
</script>
</body>
</html>
