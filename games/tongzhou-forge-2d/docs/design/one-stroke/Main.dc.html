<sc-if value="{{hud}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 12px; top: 10px; width: 92px; height: 114px; box-sizing: border-box; background: #f8f1e2; border: 3px solid #171513; clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 7px), calc(100% - 7px) 100%, 7px 100%, 0 calc(100% - 7px), 0 7px); display: flex; flex-direction: column; align-items: center; padding-top: 7px">
<div class="lat" style="font-size: 9.5px; font-weight: 700; letter-spacing: .14em; line-height: 12px; color: #cc3524">目标 GOAL</div>
<div class="zi" style="font-size: 52px; line-height: 56px; color: #171513">明</div>
<div class="lat" style="font-size: 14px; font-weight: 600; line-height: 16px">míng</div>
<div class="lat" style="font-size: 12px; line-height: 14px; color: #5a544b">bright</div>
</div>

<div style="position: absolute; right: 58px; top: 10px; height: 50px; box-sizing: border-box; padding: 0 14px 0 10px; background: #f8f1e2; border: 3px solid #171513; clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px); display: flex; align-items: center; gap: 8px">
<div class="zi" style="font-size: 32px; line-height: 36px; color: #1b5aa6">月</div>
<div style="display: flex; flex-direction: column"><div class="lat" style="font-size: 14px; font-weight: 600; line-height: 16px">yuè</div><div class="lat" style="font-size: 12px; line-height: 14px; color: #5a544b">moon</div></div>
</div>

<button aria-label="Menu" style="position: absolute; right: 12px; top: 10px; width: 38px; height: 38px; padding: 0; margin: 0; border: 0; background: #171513; clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 5px, 100% calc(100% - 5px), calc(100% - 5px) 100%, 5px 100%, 0 calc(100% - 5px), 0 5px); display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="18" viewBox="0 0 20 18" aria-hidden="true"><path d="M4,3 H16 M5,9 H15 M2,15 H18" stroke="#f8f1e2" stroke-width="2.6" fill="none"></path></svg>
</button>

<div class="lat" style="position: absolute; left: 50%; top: 68px; transform: translateX(-50%); height: 30px; box-sizing: border-box; padding: 0 22px; display: flex; align-items: center; gap: 5px; background: #f8f1e2; border-top: 2px solid #171513; border-bottom: 2px solid #171513; font-size: 13px; line-height: 16px; white-space: nowrap; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 50%, 100% 100%, 0 100%, 10px 50%)">
<span>Set</span><span class="zi" style="font-size: 18px; color: #1b5aa6">月</span><span>yuè</span><span style="font-weight: 700">beside</span><span class="zi" style="font-size: 18px; color: #b06f06">日</span><span>rì</span><span>→</span><span class="zi" style="font-size: 18px; color: #cc3524">明</span><span>míng</span>
</div>

<div aria-hidden="true" style="position: absolute; left: 18px; bottom: 12px; width: 116px; height: 116px">
<svg width="116" height="116" viewBox="0 0 116 116"><circle cx="58" cy="58" r="52" fill="none" stroke="#f1e6d0" stroke-width="7"></circle><circle cx="58" cy="58" r="52" fill="none" stroke="#171513" stroke-width="3"></circle><circle cx="66" cy="56" r="20" fill="#171513"></circle><circle cx="66" cy="56" r="20" fill="none" stroke="#f1e6d0" stroke-width="2"></circle></svg>
</div>

<button aria-label="Set beside" style="position: absolute; right: 90px; bottom: 38px; width: 58px; height: 58px; padding: 0; margin: 0; border-radius: 50%; background: #f8f1e2; border: 3px solid #171513; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #171513; cursor: pointer">
<span class="zi" style="font-size: 22px; line-height: 24px">旁</span>
<span class="lat" style="font-size: 10px; font-weight: 600; line-height: 11px">páng</span>
<span class="lat" style="font-size: 7.5px; font-weight: 800; letter-spacing: .08em; line-height: 9px">BESIDE</span>
</button>

<button aria-label="Jump" style="position: absolute; right: 14px; bottom: 14px; width: 66px; height: 66px; padding: 0; margin: 0; border-radius: 50%; background: #cc3524; border: 3px solid #171513; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f8f1e2; cursor: pointer">
<span class="zi" style="font-size: 27px; line-height: 29px">跳</span>
<span class="lat" style="font-size: 10px; font-weight: 600; line-height: 11px">tiào</span>
<span class="lat" style="font-size: 7.5px; font-weight: 800; letter-spacing: .1em; line-height: 9px">JUMP</span>
</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"time":{"editor":"enum","options":["night","daybreak"],"default":"night"},"hud":{"editor":"boolean","default":true},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const night = { sky: '#5d7182', orb: '#f1e6d0', far: '#d3cfc0', water: '#5d7182', cloud: '#f1e6d0', ghost: '#eac3ae' };
    const day = { sky: '#e9c16d', orb: '#cc3524', far: '#e0d5c1', water: '#8f887b', cloud: '#f1e6d0', ghost: '#e39a87' };
    const isDay = (this.props.time ?? 'night') === 'daybreak';
    return { c: isDay ? day : night, hud: this.props.hud ?? true };
  }
}
</script>
</body>
</html>
